prototypes:
  standard:
    formElementsDefinition:
      FriendlyCaptcha:
        formEditor:
          editors:
            100:
              identifier: header
              templateName: Inspector-FormElementHeaderEditor
            200:
              identifier: label
              templateName: Inspector-TextEditor
              label: formEditor.elements.FormElement.editor.label.label
              propertyPath: label
            300:
              identifier: doNotShowLabel
              templateName: Inspector-CheckboxEditor
              label: formEditor.elements.FriendlyCaptcha.editor.doNotShowLabel.label
              propertyPath: renderingOptions.doNotShowLabel
            900:
              identifier: validators
              templateName: Inspector-ValidatorsEditor
              label: formEditor.elements.FriendlyCaptcha.editor.validators.label
              selectOptions:
                180:
                  value: FriendlyCaptcha
                  label: formEditor.elements.FriendlyCaptcha.editor.validators.FriendlyCaptcha.label
            9999:
              identifier: removeButton
              templateName: Inspector-RemoveElementEditor

          predefinedDefaults:
            renderingOptions:
              doNotShowLabel: true
            validators:
              -
                identifier: FriendlyCaptcha
          label: formEditor.elements.FriendlyCaptcha.label
          group: custom
          groupSorting: 700
          iconIdentifier: t3-form-icon-friendlycaptcha

        implementationClassName: BalatD\FriendlyCaptcha\Domain\Model\FormElements\FriendlyCaptchaElement

        properties:
          containerClassAttribute: rriendlycaptcha

    formEditor:
      formEditorPartials:
        FormElement-FriendlyCaptcha: Stage/SimpleTemplate
